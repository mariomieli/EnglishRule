name: Supabase keep-alive

# Il piano gratuito di Supabase mette in pausa il progetto dopo ~7 giorni senza attività:
# una richiesta ogni pochi giorni lo tiene attivo.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Richiesta all'API REST
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY non configurate: niente da fare."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Risposta: $code"
          # 2xx/4xx = il progetto risponde; 5xx o nessuna risposta = in pausa o fermo
          [ "$code" -ge 200 ] && [ "$code" -lt 500 ]
